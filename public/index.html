<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Birthday Boss Tracker · MEGAMU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@500;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,500,1,0" rel="stylesheet">
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="error-banner" class="error-banner" hidden>
  <span class="material-symbols-rounded" aria-hidden="true">cloud_off</span>
  <span id="error-banner-text">Data source unavailable.</span>
</div>

<header class="app-bar">
  <div class="app-bar__title">
    <span class="app-bar__crest" aria-hidden="true">🎂</span>
    <div>
      <h1>Birthday Boss Tracker</h1>
      <p class="app-bar__subtitle">en.megamu.net · boss-log</p>
    </div>
  </div>

  <div class="app-bar__actions">
    <div class="poll-toggle">
      <span class="poll-toggle__label" id="poll-toggle-label">Polling on</span>
      <button id="poll-toggle" class="switch" role="switch" aria-checked="true" aria-labelledby="poll-toggle-label">
        <span class="switch__thumb"></span>
      </button>
    </div>
    <button id="force-fetch-btn" class="icon-btn" aria-label="Force fetch now" title="Force fetch now">
      <span class="material-symbols-rounded" aria-hidden="true">sync</span>
    </button>
    <button id="settings-btn" class="icon-btn" aria-label="Server settings" title="Server settings">
      <span class="material-symbols-rounded" aria-hidden="true">tune</span>
    </button>
  </div>
</header>

<main>
  <section class="event-panel">
    <div class="event-panel__ring-wrap">
      <svg class="event-panel__ring" viewBox="0 0 120 120" aria-hidden="true">
        <circle class="event-panel__ring-track" cx="60" cy="60" r="52" />
        <circle id="event-ring-progress" class="event-panel__ring-progress" cx="60" cy="60" r="52" />
      </svg>
      <div class="event-panel__ring-center">
        <span id="event-panel__mode" class="event-panel__mode">Next event in</span>
        <span id="event-panel__time" class="event-panel__time">--:--</span>
      </div>
    </div>

    <div class="event-panel__meta">
      <div class="event-panel__stat">
        <span class="event-panel__stat-label">Killed</span>
        <span id="stat-killed" class="event-panel__stat-value">0</span>
      </div>
      <div class="event-panel__stat">
        <span class="event-panel__stat-label">Pending</span>
        <span id="stat-pending" class="event-panel__stat-value">0</span>
      </div>
      <div class="event-panel__stat">
        <span class="event-panel__stat-label">Tracked servers</span>
        <span id="stat-total" class="event-panel__stat-value">0</span>
      </div>
    </div>
  </section>

  <section id="server-grid" class="server-grid" aria-label="Server status grid"></section>
</main>

<div id="settings-overlay" class="overlay" hidden>
  <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="settings-title">
    <div class="dialog__header">
      <h2 id="settings-title">Tracked servers</h2>
      <button id="settings-close" class="icon-btn" aria-label="Close settings">
        <span class="material-symbols-rounded" aria-hidden="true">close</span>
      </button>
    </div>

    <div class="dialog__body">
      <ul id="server-config-list" class="server-config-list"></ul>

      <form id="add-server-form" class="add-server-form">
        <input id="add-server-input" type="text" placeholder="e.g. Sv20" autocomplete="off" />
        <button type="submit" class="btn btn--filled">Add server</button>
      </form>
      <p class="dialog__hint">Toggle a server off to hide it from the board without losing it. SvC can't be tracked — it's excluded by design.</p>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
